project.ext {
    targetSdkVersion  = 35
    compileSdkVersion = 35
    buildToolsVersion = '35.0.0'
    javaVersion       = JavaVersion.VERSION_1_8

    base_releaseVersionCode     = Integer.parseInt("002040300", 10)  //Integer.MAX_VALUE == 2147483647
