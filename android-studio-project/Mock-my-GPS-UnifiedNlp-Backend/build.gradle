apply from: '../constants.gradle'
apply plugin: 'com.android.application'

android {
    namespace project.ext.nlp_applicationId

    compileSdk project.ext.compileSdk
    buildToolsVersion project.ext.buildToolsVersion

    compileOptions {
        sourceCompatibility project.ext.javaVersion
        targetCompatibility project.ext.javaVersion
    }

    defaultConfig {
        minSdk    project.ext.nlp_minSdk
        targetSdk project.ext.targetSdk

        applicationId project.ext.nlp_applicationId
        versionCode   project.ext.nlp_versionCode
        versionName   project.ext.nlp_versionName

        archivesBaseName += "-$versionName"
    }

    flavorDimensions "languageResources"

    productFlavors {
        withAllLanguageTranslations {
            dimension "languageResources"
        }
        english {
            dimension "languageResources"
        }
    }

    buildFeatures {
        aidl        = false
        buildConfig = false
    }

    buildTypes {
        release {
            debuggable      false
            jniDebuggable   false
            minifyEnabled   true
            shrinkResources true
            proguardFiles = [
                "proguard-rules.txt",
                getDefaultProguardFile('proguard-android.txt')
            ]
        }
        debug {
            debuggable      true
            jniDebuggable   true
            minifyEnabled   false
            shrinkResources false
        }
    }

    dependenciesInfo {
        includeInApk    = false  // Disables dependency metadata when building APKs.
        includeInBundle = false  // Disables dependency metadata when building Android App Bundles.
    }

    lintOptions {
        disable 'MissingTranslation'
        abortOnError true
    }
}

dependencies {
    implementation project(':Mock-my-GPS-UnifiedNlp-Backend-artifacts')

    implementation 'org.microg.nlp:api:' + '2.0-alpha10'    // (53 KB) https://mvnrepository.com/artifact/org.microg.nlp/api
}
